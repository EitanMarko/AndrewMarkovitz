# log4j2 configuration for PetiteDB.
#
# Everything goes to the console.  The PetiteDB packages run at INFO by
# default: startup/configuration events are shown, per-operation traces are
# not.  To see every block read/write/append, change logger.petitedb.level to
# debug.

status = warn
name = PetiteDB

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
# Layout of each entry:
#   line 1:    timestamp
#   line 2+:   level, thread, logger, then the message (multi-line messages put
#              one field per line)
# The extra %n leaves a blank line between entries so they're easy to scan.
appender.console.layout.pattern = %d{HH:mm:ss.SSS}%n%-5level [%t] %c{1} - %msg%n%n

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = STDOUT

logger.petitedb.name = edu.yu.dbimpl
logger.petitedb.level = info
logger.petitedb.additivity = false
logger.petitedb.appenderRef.stdout.ref = STDOUT
