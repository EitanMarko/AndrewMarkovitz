# =============================================================================
# haproxy.cfg — HAProxy configuration for StatCentral Patroni cluster
#
# HAProxy sits between PgBouncer and the Patroni-managed PostgreSQL nodes.
# It uses Patroni's REST API health endpoints to determine which node is
# currently the primary and which are replicas, then routes accordingly:
#
#   port 5000 (primary)  — only the node where GET /primary returns 200
#   port 5001 (replicas) — only nodes where GET /replica returns 200
#   port 7000 (stats)    — HAProxy admin dashboard (open in browser)
#
# On failover, Patroni promotes a replica to primary within ~10-30 seconds.
# HAProxy's health checks (every 3 seconds) detect the change and reroute
# all new connections to the newly promoted primary automatically.
# =============================================================================

global
    maxconn 100

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect 4s
    timeout server  30m
    timeout check   5s

# ─── Stats dashboard ──────────────────────────────────────────────────────────
# Browse to http://localhost:7000 after `docker compose up` to see live
# connection counts, server health, and traffic statistics.
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node

# ─── Write endpoint — PRIMARY only ───────────────────────────────────────────
# PgBouncer's statcentral_write alias connects here.
# HAProxy sends GET /primary to Patroni's REST API on port 8008.
# Only the node that returns HTTP 200 receives PostgreSQL write traffic.
# When the primary fails, Patroni promotes a replica and that node begins
# returning 200 — HAProxy picks this up within one health check interval.
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 maxconn 100 check port 8008
    server patroni2 patroni2:5432 maxconn 100 check port 8008
    server patroni3 patroni3:5432 maxconn 100 check port 8008

# ─── Read endpoint — REPLICAS only ───────────────────────────────────────────
# PgBouncer's statcentral_read alias connects here.
# HAProxy sends GET /replica to each node's Patroni REST API.
# Only standby nodes return 200 — the primary returns 503 for this endpoint.
# During failover, the promoted node temporarily has no replica; read traffic
# resumes once the old primary recovers and re-joins as a replica.
listen replicas
    bind *:5001
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 maxconn 100 check port 8008
    server patroni2 patroni2:5432 maxconn 100 check port 8008
    server patroni3 patroni3:5432 maxconn 100 check port 8008
