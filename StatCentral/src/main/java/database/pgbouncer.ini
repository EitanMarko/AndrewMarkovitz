; =============================================================================
; pgbouncer.ini — PgBouncer Configuration for StatCentral
; =============================================================================
;
; PgBouncer (short for "PostgreSQL Connection Bouncer") is a lightweight
; connection pooling middleware that sits between your application and PostgreSQL.
;
; WHY WE NEED IT:
;   PostgreSQL is expensive at managing connections. Every new connection spawns
;   a new OS process and consumes ~5–10 MB of RAM. With multiple WorkerServers,
;   each containing multiple microservices, we could easily saturate PostgreSQL's
;   connection limit. PgBouncer solves this by maintaining a small, fixed pool of
;   real database connections and multiplexing many application-level requests
;   through them — dramatically reducing connection overhead.
;
; HOW WE USE IT FOR READ/WRITE SPLITTING:
;   We define TWO database aliases in the [databases] section below:
;     - statcentral_write → points to the PRIMARY PostgreSQL node
;     - statcentral_read  → points to the REPLICA PostgreSQL node
;
;   Write microservices (PlayerHandler, LeagueStructureManager, StatUpdater)
;   connect using the JDBC URL for statcentral_write.
;
;   Read microservices (PlayerStatQuerier, AggregateStatQuerier) connect using
;   the JDBC URL for statcentral_read.
;
;   This ensures expensive fan aggregate queries never compete with league write
;   operations for database connections or CPU time on the primary node.
;
; POOL MODE — TRANSACTION (chosen here):
;   There are three modes: session, transaction, and statement.
;   - session:     A server connection is held for the full client session.
;                  Safest, but wastes connections.
;   - transaction: A server connection is only held for the duration of one
;                  transaction, then returned to the pool. THIS IS WHAT WE USE.
;                  Best balance of safety and efficiency for our microservices,
;                  which open short-lived connections per operation.
;   - statement:   A server connection is returned after each statement.
;                  Most efficient, but incompatible with multi-statement
;                  transactions. Too risky for write operations.
; =============================================================================


; -----------------------------------------------------------------------------
; [databases] — Define named connection targets.
;
; Each entry maps an ALIAS (what the application connects to) to a real
; PostgreSQL host. The application uses the alias as the database name in
; its JDBC connection string. PgBouncer transparently routes it to the host.
;
; Replace the host/port/dbname values with your actual server addresses.
; In a containerized deployment (e.g. Docker/Kubernetes), these would be
; the service names of your primary and replica PostgreSQL containers.
; -----------------------------------------------------------------------------
[databases]

; WRITE alias — routes to HAProxy port 5000, which forwards only to the
; current Patroni primary. Used by PlayerHandler, LeagueStructureManager,
; and StatUpdater for all INSERT / UPDATE / DELETE operations.
statcentral_write = host=haproxy port=5000 dbname=statcentral user=appuser password=apppassword

; READ alias  — routes to HAProxy port 5001, which forwards only to the
; current Patroni replica(s). Used by PlayerStatQuerier and AggregateStatQuerier
; for all SELECT-only operations, keeping read traffic off the primary.
statcentral_read  = host=haproxy port=5001 dbname=statcentral user=appuser password=apppassword


; -----------------------------------------------------------------------------
; [pgbouncer] — Core PgBouncer settings.
; -----------------------------------------------------------------------------
[pgbouncer]

; The port PgBouncer itself listens on.
; Your application's JDBC URL will target THIS port on the PgBouncer host,
; not the PostgreSQL port directly.
listen_port = 6432

; Listen on all interfaces. In production, lock this down to the internal
; network interface only (e.g. the VPC or container network).
listen_addr = *

; Authentication type. 'trust' allows any client to connect without a password.
; Acceptable for local development only — switch to 'md5' or 'scram-sha-256'
; with hashed passwords in userlist.txt before any non-local deployment.
auth_type = trust

; Path to the file that stores valid username/password pairs for PgBouncer.
; PgBouncer authenticates the APPLICATION connecting to it using this file —
; separately from how PostgreSQL authenticates PgBouncer itself.
auth_file = /etc/pgbouncer/userlist.txt

; --- Pool Mode ---
; Use transaction-level pooling for all databases (explained at top of file).
pool_mode = transaction

; HikariCP (and the PostgreSQL JDBC driver) send extra_float_digits as a
; connection startup parameter. PgBouncer in transaction mode rejects
; unrecognized startup parameters by default, which breaks pool initialization.
; This tells PgBouncer to silently ignore it.
ignore_startup_parameters = extra_float_digits

; --- Connection Limits ---

; Maximum total number of client connections PgBouncer will accept across
; all pools. This is the ceiling for all microservice connections combined.
max_client_conn = 200

; Default number of server connections (real PostgreSQL connections) per
; database-user pair. So each alias (write + read) gets this many real
; connections to PostgreSQL. Total real connections = 2 aliases × 20 = 40,
; well within PostgreSQL's default limit of 100.
;
; Tune this based on your PostgreSQL server capacity. A good starting rule
; is: default_pool_size ≤ (PostgreSQL max_connections / number_of_aliases)
default_pool_size = 20

; Minimum number of server connections kept open even when idle.
; Avoids cold-start latency when a burst of requests arrives.
min_pool_size = 5

; Number of extra connections allowed temporarily when the pool is full.
; These are used for a brief period while waiting for a slot to open up.
reserve_pool_size = 5

; How many seconds a client can wait for a connection from the pool before
; PgBouncer returns a timeout error. Prevents clients from hanging forever.
reserve_pool_timeout = 3

; --- Logging ---
; Log connection opens and closes. Useful for debugging; disable in
; high-throughput production to reduce I/O.
log_connections = 1
log_disconnections = 1

; Log slow queries (queries taking longer than this many seconds).
; Helps identify slow aggregate fan queries that may need optimization.
log_pooler_errors = 1

; --- Administrative Interface ---
; PgBouncer exposes an admin console at this database name.
; Connect with: psql -h localhost -p 6432 -U pgbouncer pgbouncer
; Useful commands: SHOW POOLS; SHOW STATS; SHOW CLIENTS; RELOAD;
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
