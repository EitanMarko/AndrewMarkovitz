# simplelogger.properties
# Controls log levels for the slf4j-simple backend used by HikariCP.
#
# HikariCP emits INFO messages when connection pools start ("WritePool - Starting...",
# "Added connection ...", "Start completed.").  Setting its level to WARN suppresses
# those routine startup messages while still surfacing genuine warnings and errors
# (e.g. connection failures, pool exhaustion).

# Suppress HikariCP's INFO-level pool startup/teardown messages.
org.slf4j.simpleLogger.log.com.zaxxer.hikari=WARN