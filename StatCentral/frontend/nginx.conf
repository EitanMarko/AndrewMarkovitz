server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Static front-end files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls server-side to the GatewayServer container. Keeping the
    # browser-facing origin the same for both the page and the API avoids
    # needing CORS headers on GatewayServer (which doesn't send any today).
    location /request {
        proxy_pass http://statcentral-app:8080/request;
        proxy_set_header Host $host;
    }

    location /status {
        proxy_pass http://statcentral-app:8080/status;
        proxy_set_header Host $host;
    }
}
